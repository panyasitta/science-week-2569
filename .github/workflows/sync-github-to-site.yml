name: Sync GitHub data to GPT Site

on:
  push:
    branches: [main]
    paths:
      - 'data/sync-data.json'
      - 'scripts/post-sync-to-site.mjs'
      - '.github/workflows/sync-github-to-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: science-week-2569-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send signed snapshot to GPT Site
        run: node scripts/post-sync-to-site.mjs
