name: Fix certificate list

on:
  push:
    paths:
      - '.github/workflows/fix-certificate-list.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make Drive certificates a direct page fallback
        shell: python
        run: |
          from pathlib import Path

          patch = Path('app/certificate-fetch-patch.tsx')
          text = patch.read_text(encoding='utf-8')
          text = text.replace('const driveCertificates = makeDriveCertificates();', 'export const driveCertificates = makeDriveCertificates();')
          text = text.replace('function mergeCertificates(liveCertificates: PublicCertificate[]): PublicCertificate[] {', 'export function mergeCertificates(liveCertificates: PublicCertificate[]): PublicCertificate[] {')
          patch.write_text(text, encoding='utf-8')

          page = Path('app/page.tsx')
          text = page.read_text(encoding='utf-8')
          old_import = 'import type { ActivityPayload } from "./lib/content-model";'
          new_import = old_import + '\nimport { driveCertificates, mergeCertificates } from "./certificate-fetch-patch";'
          if 'driveCertificates, mergeCertificates' not in text:
              text = text.replace(old_import, new_import)

          text = text.replace(
              'const [certificates, setCertificates] = useState<PublicCertificate[]>([]);\n  const [certificatesLoaded, setCertificatesLoaded] = useState(false);',
              'const [certificates, setCertificates] = useState<PublicCertificate[]>(driveCertificates);\n  const [certificatesLoaded, setCertificatesLoaded] = useState(true);'
          )

          text = text.replace(
              '.then((data: { certificates?: PublicCertificate[] }) => setCertificates(Array.isArray(data.certificates) ? data.certificates : []))',
              '.then((data: { certificates?: PublicCertificate[] }) => setCertificates(mergeCertificates(Array.isArray(data.certificates) ? data.certificates : [])))'
          )

          text = text.replace(
              'if (!(error instanceof DOMException && error.name === "AbortError")) console.warn("ไม่สามารถโหลดรายการเกียรติบัตร", error);',
              'if (!(error instanceof DOMException && error.name === "AbortError")) console.warn("ใช้รายการเกียรติบัตรสำรองจาก Google Drive", error);'
          )

          text = text.replace('ตรวจสอบกิจกรรม ชั้น/ห้อง และรางวัลก่อนดาวน์โหลดไฟล์ PDF', 'ตรวจสอบกิจกรรม ชั้น/ห้อง และรางวัลก่อนดาวน์โหลดไฟล์เกียรติบัตร')
          text = text.replace('>ดาวน์โหลด PDF <span>↓</span></a>', '>ดาวน์โหลดเกียรติบัตร <span>↓</span></a>')
          page.write_text(text, encoding='utf-8')

      - name: Verify static certificate count
        shell: python
        run: |
          from pathlib import Path
          text = Path('app/certificate-fetch-patch.tsx').read_text(encoding='utf-8')
          assert 'export const driveCertificates' in text
          assert 'export function mergeCertificates' in text
          page = Path('app/page.tsx').read_text(encoding='utf-8')
          assert 'useState<PublicCertificate[]>(driveCertificates)' in page
          assert 'mergeCertificates(Array.isArray(data.certificates)' in page
          print('Certificate fallback wired directly into page state')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Show Drive certificates without relying on API timing"
          git push
